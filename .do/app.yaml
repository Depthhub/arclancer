name: arclancer
domains:
  - domain: arclancer.xyz
    type: PRIMARY
  - domain: www.arclancer.xyz
    type: ALIAS
  - domain: mcp.arclancer.xyz
    type: ALIAS
ingress:
  rules:
    - component:
        name: mcp-server
        preserve_path_prefix: true
      match:
        authority:
          exact: mcp.arclancer.xyz
        path:
          prefix: /
    - component:
        name: mcp-server
        preserve_path_prefix: true
      match:
        path:
          prefix: /mcp
    - component:
        name: mcp-server
        preserve_path_prefix: true
      match:
        path:
          prefix: /oauth
    - component:
        name: mcp-server
        preserve_path_prefix: true
      match:
        path:
          prefix: /.well-known
    - component:
        name: mcp-server
        preserve_path_prefix: true
      match:
        path:
          prefix: /health
    - component:
        name: mcp-server
        preserve_path_prefix: true
      match:
        path:
          prefix: /creator-tickets
    - component:
        name: frontend
      match:
        path:
          prefix: /
services:
  - name: frontend
    github:
      repo: Depthhub/arclancer
      branch: main
      deploy_on_push: true
    source_dir: frontend
    build_command: npm run build
    run_command: npm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: NEXT_PUBLIC_APP_URL
        value: "https://arclancer.xyz"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_MCP_URL
        value: "https://arclancer.xyz/mcp"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_CCTP_UI_ENABLED
        value: "true"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_AGENTS_UI_ENABLED
        value: "true"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_REGISTRY_ADDRESS
        value: "0x28c87a31a6e608dbf90839d10567ed44e7e3bbd1"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_FACTORY_ADDRESS
        value: "0x0ADf70A390868c7016697edF0640791c3B3e5f31"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_EURC_ADDRESS
        value: "0x89B50855Aa3bE2F677cD6303Cec089B5F319D72a"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_STABLEFX_ADDRESS
        value: "0x1f91886C7028986aD885ffCee0e40b75C9cd5aC1"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_ARC_TESTNET_RPC_URL
        value: "https://rpc.testnet.arc.network"
        scope: RUN_AND_BUILD_TIME
      - key: DIGITALOCEAN_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: TELEGRAM_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: TELEGRAM_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: UPSTASH_REDIS_REST_URL
        scope: RUN_TIME
        type: SECRET
      - key: UPSTASH_REDIS_REST_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: WALLET_ENCRYPTION_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: CIRCLE_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NEXT_PUBLIC_CIRCLE_APP_ID
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: NEXT_PUBLIC_CIRCLE_WALLETS_ENABLED
        value: "true"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_CHATGPT_INSTALL_URL
        value: "https://chatgpt.com/plugins"
        scope: RUN_AND_BUILD_TIME
      - key: ARC_NETWORK
        value: "testnet"
        scope: RUN_TIME
      - key: CIRCLE_PAYMENT_GATEWAY_URL
        scope: RUN_TIME
        type: SECRET
      - key: OPENCLAW_WORKER_URL
        value: "redis"
        scope: RUN_TIME
      - key: MCP_INTERNAL_URL
        value: "http://mcp-server:3100"
        scope: RUN_TIME
  - name: mcp-server
    github:
      repo: Depthhub/arclancer
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm --prefix frontend install && npm --prefix mcp-server install
    run_command: npm --prefix mcp-server run start:http
    http_port: 3100
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
    envs:
      - key: MCP_HTTP_PORT
        value: "3100"
        scope: RUN_TIME
      - key: NEXT_PUBLIC_APP_URL
        value: "https://arclancer.xyz"
        scope: RUN_TIME
      - key: MCP_PUBLIC_ORIGIN
        value: "https://arclancer.xyz"
        scope: RUN_TIME
      - key: APP_PUBLIC_ORIGIN
        value: "https://arclancer.xyz"
        scope: RUN_TIME
      - key: NEXT_PUBLIC_ARC_TESTNET_RPC_URL
        value: "https://rpc.testnet.arc.network"
        scope: RUN_TIME
      - key: MCP_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: WALLET_ENCRYPTION_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: CIRCLE_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: ARC_NETWORK
        value: "testnet"
        scope: RUN_TIME
      - key: CIRCLE_PAYMENT_GATEWAY_URL
        scope: RUN_TIME
        type: SECRET
      - key: UPSTASH_REDIS_REST_URL
        scope: RUN_TIME
        type: SECRET
      - key: UPSTASH_REDIS_REST_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: CREATOR_MCP_TICKET_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: CREATOR_MCP_TICKET_TTL_SECONDS
        value: "300"
        scope: RUN_TIME

workers:
  - name: openclaw-worker
    github:
      repo: Depthhub/arclancer
      branch: main
      deploy_on_push: true
    source_dir: backend/worker
    dockerfile_path: Dockerfile
    envs:
      - key: DIGITALOCEAN_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: UPSTASH_REDIS_REST_URL
        scope: RUN_TIME
        type: SECRET
      - key: UPSTASH_REDIS_REST_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: VERCEL_CALLBACK_URL
        value: "${frontend.PUBLIC_URL}/api/telegram/callback"
        scope: RUN_TIME
      - key: OPENCLAW_WORKER_SECRET
        value: "arclancer-worker-secret-2026"
        scope: RUN_TIME

