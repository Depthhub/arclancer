name: arclancer
services:
  - name: frontend
    github:
      repo: Depthhub/arclancer
      branch: main
      deploy_on_push: true
    source_dir: frontend
    build_command: npm run build
    run_command: npm start
    http_port: 3000
    envs:
      - key: NEXT_PUBLIC_APP_URL
        value: "https://arclancer-58ipp.ondigitalocean.app"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_CCTP_UI_ENABLED
        value: "true"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_FACTORY_ADDRESS
        value: "0x0ADf70A390868c7016697edF0640791c3B3e5f31"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_EURC_ADDRESS
        value: "0x89B50855Aa3bE2F677cD6303Cec089B5F319D72a"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_STABLEFX_ADDRESS
        value: "0x1f91886C7028986aD885ffCee0e40b75C9cd5aC1"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_ARC_TESTNET_RPC_URL
        value: "https://rpc.testnet.arc.network"
        scope: RUN_AND_BUILD_TIME
      - key: DIGITALOCEAN_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: TELEGRAM_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: TELEGRAM_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: UPSTASH_REDIS_REST_URL
        scope: RUN_TIME
        type: SECRET
      - key: UPSTASH_REDIS_REST_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: WALLET_ENCRYPTION_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: OPENCLAW_WORKER_URL
        value: "redis"
        scope: RUN_TIME

workers:
  - name: openclaw-worker
    github:
      repo: Depthhub/arclancer
      branch: main
      deploy_on_push: true
    source_dir: backend/worker
    dockerfile_path: Dockerfile
    envs:
      - key: DIGITALOCEAN_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: UPSTASH_REDIS_REST_URL
        scope: RUN_TIME
        type: SECRET
      - key: UPSTASH_REDIS_REST_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: VERCEL_CALLBACK_URL
        value: "${frontend.PUBLIC_URL}/api/telegram/callback"
        scope: RUN_TIME
      - key: OPENCLAW_WORKER_SECRET
        value: "arclancer-worker-secret-2026"
        scope: RUN_TIME
